<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Infinity Room</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Oswald', sans-serif;
            background-color: #0d0d0d; /* Fondo oscuro */
            color: #fff;
            overflow: hidden; /* Evita barras de scroll */
        }
        .landing-container {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .content {
            position: relative;
            z-index: 10;
        }
        .logo {
            width: 100%;
            max-width: 280px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: clamp(2.5rem, 6vw, 4rem); /* Tamaño de fuente adaptable */
            background: linear-gradient(270deg, #66aaff, #3366ff, #6699ff, #aaccff, #66aaff);
            background-size: 800% 800%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textAurora 8s ease infinite;
        }
        @keyframes textAurora {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .slogan {
            font-size: clamp(1rem, 2.5vw, 1.25rem);
            opacity: 0.8;
            margin-top: 10px;
            letter-spacing: 0.7px;
        }
        .section-wrapper {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            margin-top: 40px;
        }
        .column {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .column h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        a.glow-button {
            text-decoration: none;
            color: #fff;
        }
        .glow-button {
            background-color: #1a1a1a;
            border: 1px solid #333;
            padding: 12px 28px;
            min-width: 230px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 20px;
            transition: all 0.3s ease;
        }
        .glow-button:hover {
            box-shadow: 0 0 10px #3399ff, 0 0 20px #3399ff;
            transform: scale(1.03);
            border-color: #4973ff;
        }
        .icon {
            font-size: 18px;
        }
        .wave-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 15%;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="landing-container">
        <div class="content">
            <h1>INFINITY ROOM</h1>
            <div class="slogan">MULTIPLE AI SCALPING ANALYSIS SYSTEM</div>
            <div class="section-wrapper">
                <div class="column">
                    <h2>ESTRATEGIAS</h2>
                    <a href="https://web-production-13197.up.railway.app/Pivots_Bitcoin" class="glow-button"><span class="icon">🧠</span> BTC STRATEGY</a>
                    <a href="https://web-production-13197.up.railway.app/Pivots_Altcoins" class="glow-button"><span class="icon">📈</span> ALTCOINS STRATEGY</a>
                    <a href="https://web-production-13197.up.railway.app/Chat_con_IA" class="glow-button"><span class="icon">💬</span> IA CHAT LOG</a>
                </div>
                <div class="column">
                    <h2>HERRAMIENTAS</h2>
                    <a href="https://web-production-13197.up.railway.app/Log_de_Actividad" class="glow-button"><span class="icon">📜</span> ACTIVITY LOG</a>
                    <a href="https://web-production-13197.up.railway.app/Simulador_de_Rendimiento" class="glow-button"><span class="icon">📊</span> PERFORMANCE SIMULATOR</a>
                    <a href="https://web-production-13197.up.railway.app/Backtesting" class="glow-button"><span class="icon">🚀</span> BACKTESTING</a>
                </div>
            </div>
        </div>
        <div class="wave-container">
            <svg viewBox="0 0 1440 320" xmlns="http://www.w3.org/2000/svg" style="position: absolute; bottom: 0; left: 0; width: 100%;">
                <path fill="#4973ff" fill-opacity="0.7" d="M0,224L48,208C96,192,192,160,288,170.7C384,181,480,235,576,250.7C672,267,768,245,864,213.3C960,181,1056,139,1152,128C1248,117,1344,139,1392,149.3L1440,160L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
            </svg>
        </div>
    </div>
</body>
</html>
