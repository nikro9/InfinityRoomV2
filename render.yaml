# render.yaml - Render Blueprint for Kublai Trading Platform
# https://render.com/docs/blueprint-spec

services:
  # ================================
  # API Server (FastAPI)
  # ================================
  - type: web
    name: kublai-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        value: https://kublai.netlify.app
      - key: ENVIRONMENT
        value: production

  # ================================
  # Bitcoin Worker (Background)
  # ================================
  - type: worker
    name: kublai-btc-worker
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerCommand: python infinity_worker.py
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: ENVIRONMENT
        value: production

  # ================================
  # Altcoin Worker (Background)
  # ================================
  - type: worker
    name: kublai-altcoin-worker
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerCommand: python altcoin_worker.py
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: ENVIRONMENT
        value: production
