# render.yaml - Kublai Trading Platform
# ARCHITECTURE: Single web service with embedded workers
# Workers run as background threads inside the API process.
# This avoids the need for paid background worker services.
# Use UptimeRobot (free) to ping /ping every 14 min to prevent sleep.

services:
  # ================================
  # Unified API + Workers
  # ================================
  - type: web
    name: kublai-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: FRONTEND_URL
        value: https://kublai.netlify.app
      - key: ENABLE_WORKERS
        value: "true"
      - key: ENVIRONMENT
        value: production
